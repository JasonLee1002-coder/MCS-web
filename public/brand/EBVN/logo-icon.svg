<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="EB+ VitaNet Logo">
  <defs>
    <filter id="glow-leaf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-node" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leaf-clip">
      <path d="M60,10 C95,10 110,40 108,65 C106,90 85,108 60,112 C35,108 14,90 12,65 C10,40 25,10 60,10 Z"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <circle cx="60" cy="60" r="60" fill="#0D2818"/>

  <!-- Leaf glow halo -->
  <path d="M60,10 C95,10 110,40 108,65 C106,90 85,108 60,112 C35,108 14,90 12,65 C10,40 25,10 60,10 Z"
        fill="none" stroke="#00B894" stroke-width="8" opacity="0.18" filter="url(#glow-leaf)"/>

  <!-- Leaf outline -->
  <path d="M60,10 C95,10 110,40 108,65 C106,90 85,108 60,112 C35,108 14,90 12,65 C10,40 25,10 60,10 Z"
        fill="#00B894" fill-opacity="0.08" stroke="#00B894" stroke-width="2.2"/>

  <!-- Network lines clipped to leaf -->
  <g clip-path="url(#leaf-clip)" stroke="#F9CA24" stroke-width="1.1" opacity="0.85">
    <!-- Central midrib -->
    <line x1="60" y1="10" x2="60" y2="112"/>
    <!-- Left veins -->
    <line x1="60" y1="36" x2="24" y2="53"/>
    <line x1="60" y1="54" x2="16" y2="66"/>
    <line x1="60" y1="72" x2="20" y2="84"/>
    <line x1="60" y1="90" x2="34" y2="102"/>
    <!-- Right veins -->
    <line x1="60" y1="36" x2="96" y2="53"/>
    <line x1="60" y1="54" x2="104" y2="66"/>
    <line x1="60" y1="72" x2="100" y2="84"/>
    <line x1="60" y1="90" x2="86" y2="102"/>
  </g>

  <!-- Gold nodes — midrib -->
  <g filter="url(#glow-node)">
    <circle cx="60" cy="10"  r="3.2" fill="#F9CA24"/>
    <circle cx="60" cy="36"  r="3.2" fill="#F9CA24"/>
    <circle cx="60" cy="54"  r="3.2" fill="#F9CA24"/>
    <circle cx="60" cy="72"  r="3.2" fill="#F9CA24"/>
    <circle cx="60" cy="90"  r="3.2" fill="#F9CA24"/>
    <circle cx="60" cy="112" r="3.2" fill="#F9CA24"/>
    <!-- Left branch endpoints -->
    <circle cx="24" cy="53"  r="2.5" fill="#F9CA24" opacity="0.9"/>
    <circle cx="16" cy="66"  r="2.5" fill="#F9CA24" opacity="0.9"/>
    <circle cx="20" cy="84"  r="2.5" fill="#F9CA24" opacity="0.9"/>
    <circle cx="34" cy="102" r="2.5" fill="#F9CA24" opacity="0.9"/>
    <!-- Right branch endpoints -->
    <circle cx="96" cy="53"  r="2.5" fill="#F9CA24" opacity="0.9"/>
    <circle cx="104" cy="66" r="2.5" fill="#F9CA24" opacity="0.9"/>
    <circle cx="100" cy="84" r="2.5" fill="#F9CA24" opacity="0.9"/>
    <circle cx="86" cy="102" r="2.5" fill="#F9CA24" opacity="0.9"/>
  </g>
</svg>
