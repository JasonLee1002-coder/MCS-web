<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" role="img" aria-label="EB+ VitaNet">
  <defs>
    <filter id="glow-v" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-nv" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leaf-v">
      <path d="M120,20 C155,20 175,52 173,82 C171,112 148,132 120,136 C92,132 69,112 67,82 C65,52 85,20 120,20 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="240" height="300" fill="#0D2818" rx="12"/>

  <!-- Leaf glow halo -->
  <path d="M120,20 C155,20 175,52 173,82 C171,112 148,132 120,136 C92,132 69,112 67,82 C65,52 85,20 120,20 Z"
        fill="none" stroke="#00B894" stroke-width="9" opacity="0.2" filter="url(#glow-v)"/>
  <!-- Leaf body -->
  <path d="M120,20 C155,20 175,52 173,82 C171,112 148,132 120,136 C92,132 69,112 67,82 C65,52 85,20 120,20 Z"
        fill="#00B894" fill-opacity="0.08" stroke="#00B894" stroke-width="2.5"/>

  <!-- Network lines -->
  <g clip-path="url(#leaf-v)" stroke="#F9CA24" stroke-width="1.3" opacity="0.85">
    <line x1="120" y1="20"  x2="120" y2="136"/>
    <line x1="120" y1="48"  x2="80"  y2="66"/>
    <line x1="120" y1="68"  x2="70"  y2="82"/>
    <line x1="120" y1="88"  x2="74"  y2="102"/>
    <line x1="120" y1="108" x2="88"  y2="122"/>
    <line x1="120" y1="48"  x2="160" y2="66"/>
    <line x1="120" y1="68"  x2="170" y2="82"/>
    <line x1="120" y1="88"  x2="166" y2="102"/>
    <line x1="120" y1="108" x2="152" y2="122"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#glow-nv)">
    <circle cx="120" cy="20"  r="3.5" fill="#F9CA24"/>
    <circle cx="120" cy="48"  r="3.5" fill="#F9CA24"/>
    <circle cx="120" cy="68"  r="3.5" fill="#F9CA24"/>
    <circle cx="120" cy="88"  r="3.5" fill="#F9CA24"/>
    <circle cx="120" cy="108" r="3.5" fill="#F9CA24"/>
    <circle cx="120" cy="136" r="3.5" fill="#F9CA24"/>
    <circle cx="80"  cy="66"  r="2.8" fill="#F9CA24" opacity="0.9"/>
    <circle cx="70"  cy="82"  r="2.8" fill="#F9CA24" opacity="0.9"/>
    <circle cx="74"  cy="102" r="2.8" fill="#F9CA24" opacity="0.9"/>
    <circle cx="88"  cy="122" r="2.8" fill="#F9CA24" opacity="0.9"/>
    <circle cx="160" cy="66"  r="2.8" fill="#F9CA24" opacity="0.9"/>
    <circle cx="170" cy="82"  r="2.8" fill="#F9CA24" opacity="0.9"/>
    <circle cx="166" cy="102" r="2.8" fill="#F9CA24" opacity="0.9"/>
    <circle cx="152" cy="122" r="2.8" fill="#F9CA24" opacity="0.9"/>
  </g>

  <!-- Gold divider -->
  <line x1="30" y1="158" x2="210" y2="158" stroke="#F9CA24" stroke-width="0.8" opacity="0.5"/>

  <!-- Brand name -->
  <text x="120" y="192"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">EB+ VitaNet</text>
  <!-- TM -->
  <text x="205" y="178"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="10" font-weight="400" fill="#F9CA24">™</text>

  <!-- Tagline line 1 -->
  <text x="120" y="222"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="9.5" font-weight="300" fill="#00B894" text-anchor="middle" letter-spacing="1.8">WHERE TECHNOLOGY</text>
  <!-- Tagline line 2 -->
  <text x="120" y="238"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="9.5" font-weight="300" fill="#00B894" text-anchor="middle" letter-spacing="1.8">NOURISHES LIFE</text>

  <!-- Bottom gold accent -->
  <rect x="96" y="262" width="48" height="2" rx="1" fill="#F9CA24" opacity="0.6"/>
</svg>
