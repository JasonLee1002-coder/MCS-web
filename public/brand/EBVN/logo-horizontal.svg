<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" role="img" aria-label="EB+ VitaNet">
  <defs>
    <filter id="glow-h" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-n" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leaf-h">
      <path d="M50,6 C79,6 92,28 90,52 C88,76 71,90 50,93 C29,90 12,76 10,52 C8,28 21,6 50,6 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="420" height="100" fill="#0D2818" rx="10"/>

  <!-- === LEAF ICON === -->
  <!-- Glow halo -->
  <path d="M50,6 C79,6 92,28 90,52 C88,76 71,90 50,93 C29,90 12,76 10,52 C8,28 21,6 50,6 Z"
        fill="none" stroke="#00B894" stroke-width="7" opacity="0.2" filter="url(#glow-h)"/>
  <!-- Leaf body -->
  <path d="M50,6 C79,6 92,28 90,52 C88,76 71,90 50,93 C29,90 12,76 10,52 C8,28 21,6 50,6 Z"
        fill="#00B894" fill-opacity="0.08" stroke="#00B894" stroke-width="1.8"/>
  <!-- Network lines -->
  <g clip-path="url(#leaf-h)" stroke="#F9CA24" stroke-width="1" opacity="0.85">
    <line x1="50" y1="6"  x2="50" y2="93"/>
    <line x1="50" y1="28" x2="20" y2="42"/>
    <line x1="50" y1="44" x2="13" y2="54"/>
    <line x1="50" y1="60" x2="16" y2="70"/>
    <line x1="50" y1="76" x2="28" y2="85"/>
    <line x1="50" y1="28" x2="80" y2="42"/>
    <line x1="50" y1="44" x2="87" y2="54"/>
    <line x1="50" y1="60" x2="84" y2="70"/>
    <line x1="50" y1="76" x2="72" y2="85"/>
  </g>
  <!-- Nodes -->
  <g filter="url(#glow-n)">
    <circle cx="50" cy="6"  r="2.8" fill="#F9CA24"/>
    <circle cx="50" cy="28" r="2.8" fill="#F9CA24"/>
    <circle cx="50" cy="44" r="2.8" fill="#F9CA24"/>
    <circle cx="50" cy="60" r="2.8" fill="#F9CA24"/>
    <circle cx="50" cy="76" r="2.8" fill="#F9CA24"/>
    <circle cx="50" cy="93" r="2.8" fill="#F9CA24"/>
    <circle cx="20" cy="42" r="2.2" fill="#F9CA24" opacity="0.9"/>
    <circle cx="13" cy="54" r="2.2" fill="#F9CA24" opacity="0.9"/>
    <circle cx="16" cy="70" r="2.2" fill="#F9CA24" opacity="0.9"/>
    <circle cx="28" cy="85" r="2.2" fill="#F9CA24" opacity="0.9"/>
    <circle cx="80" cy="42" r="2.2" fill="#F9CA24" opacity="0.9"/>
    <circle cx="87" cy="54" r="2.2" fill="#F9CA24" opacity="0.9"/>
    <circle cx="84" cy="70" r="2.2" fill="#F9CA24" opacity="0.9"/>
    <circle cx="72" cy="85" r="2.2" fill="#F9CA24" opacity="0.9"/>
  </g>

  <!-- === WORDMARK === -->
  <!-- Brand name -->
  <text x="112" y="46"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">EB+ VitaNet</text>
  <!-- TM mark -->
  <text x="366" y="32"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="400" fill="#F9CA24">™</text>
  <!-- Gold divider line -->
  <line x1="112" y1="54" x2="390" y2="54" stroke="#F9CA24" stroke-width="0.8" opacity="0.6"/>
  <!-- Tagline -->
  <text x="112" y="70"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="10.5" font-weight="300" fill="#00B894" letter-spacing="2">WHERE TECHNOLOGY NOURISHES LIFE</text>
</svg>
